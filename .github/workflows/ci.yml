# FINAL: the slim per-repo replacement for .github/workflows/ci.yml
# Drop this into each npm repo. It does nothing but delegate to the shared definition.
# Pinned to a commit SHA (not @master) so a change to the shared reusable workflow
# only reaches this repo when the SHA is bumped deliberately. See the uses: line below.
name: CI

# Least privilege for the default GITHUB_TOKEN: every job here only reads the repo.
permissions:
  contents: read

on:
  push:
    # develop is where all work lands; master only ever receives release PRs.
    # Both run the gate: develop so a lane push is verified as it lands, master
    # so the merge commit a release tag points at has its own green run.
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  ci:
    uses: XChain-Platform/.github/.github/workflows/ci-reusable.yml@ece256eede852d0cb0da5f8d3bec02051085c4de # pin: XChain-Platform/.github @ master 2026-08-14; bump deliberately
    # Override the Node version for a repo if ever needed:
    # with:
    #   node-version: "20"

  # The e2e tier runs a real server/client pair (REST + WebSocket) against
  # throwaway source + replica MariaDBs and asserts byte-identical replication,
  # disconnect/resume parity, and durable halts (incl. the seeded-PRNG
  # interleave property suite). It lives outside the shared reusable workflow
  # because it needs two DB service containers and the canonical sibling
  # schemas: the source DB is seeded from xchain-indexer/src/sql (and the
  # decoder-lifecycle suite from xchain-decoder/src/sql), so the harness can
  # never drift from the real schemas. Service-container env values are the
  # same throwaway fixture credentials committed in test/e2e/docker-compose.e2e.yml.
  e2e:
    runs-on: ubuntu-latest
    services:
      source-db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_USER: xchain-node
          MARIADB_PASSWORD: xchain-fixture-throwaway
        ports:
          - 23306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
      replica-db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_USER: xchain-node
          MARIADB_PASSWORD: xchain-fixture-throwaway
        ports:
          - 23307:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      # Siblings go BESIDE the checkout, not inside it. The schema seeding only
      # ever needed a path, so `.xchain-indexer` worked for it; the cross-repo
      # guards below resolve `../<repo>` the way a developer checkout is laid out,
      # and four of them failed on a run that had the sibling all along, just in
      # the wrong place. `git clone` because actions/checkout refuses a path
      # outside the workspace. Both repos are public now, so the two read-only
      # deploy keys this used to need are gone. Roster = .ci-siblings, the same
      # declaration the e2e venue reads.
      - name: Check out declared sibling repositories
        env:
          SIBLINGS_REF: ${{ github.ref == 'refs/heads/master' && 'master' || 'develop' }}
        run: |
          set -euo pipefail
          repos=$(sed 's/#.*//' .ci-siblings | tr -d '\r' | awk 'NF')
          cd "$GITHUB_WORKSPACE/.."
          for repo in $repos; do
            rm -rf "$repo"
            url="https://github.com/${{ github.repository_owner }}/$repo.git"
            git clone --quiet --depth 1 --branch "$SIBLINGS_REF" "$url" "$repo" 2>/dev/null \
              || git clone --quiet --depth 1 "$url" "$repo"
            echo "sibling $repo @ $(git -C "$repo" rev-parse --abbrev-ref HEAD) $(git -C "$repo" rev-parse --short HEAD)"
          done

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # The cross-repo consensus drift guards (rollback-coverage.test.js) compare
      # this repo's rollback/SQL/byte-identical twins against the source indexer.
      # They live in the unit tier but the shared `ci` job never checks out the
      # sibling, so they silently skip there (#4631). Run them HERE, where the
      # sibling IS checked out, with XCHAIN_REQUIRE_SIBLINGS=1 so a missing sibling
      # hard-fails instead of green-by-skip. Pure source comparisons (no DB).
      # generatedColumns.test.js joins this list for exactly the reason the comment
      # above gives, and it walked straight into the trap: it derives the frozen
      # generated-column map from the indexer AND decoder DDL, so in the shared `ci`
      # job (no siblings checked out) it skips, and a guard that only ever skips
      # protects nothing. It needs the DECODER path too, which this job already has
      # checked out for the e2e tier.
      - name: Run cross-repo consensus drift guards against the checked-out indexer
        env:
          XCHAIN_INDEXER_SQL_PATH: ${{ github.workspace }}/../xchain-indexer/src/sql
          XCHAIN_DECODER_SQL_PATH: ${{ github.workspace }}/../xchain-decoder/src/sql
          XCHAIN_REQUIRE_SIBLINGS: "1"
        run: npx mocha --timeout 10000 test/unit/rollback-coverage.test.js test/unit/blockhash-conformance-twin.test.js test/unit/protocolAddressRoles.twin.test.js test/unit/stakesValidatorSetParity.test.js test/unit/generatedColumns.test.js

      - name: Run the e2e tier
        env:
          XCHAIN_INDEXER_SQL_PATH: ${{ github.workspace }}/../xchain-indexer/src/sql
          XCHAIN_DECODER_SQL_PATH: ${{ github.workspace }}/../xchain-decoder/src/sql
        run: npm run test:e2e:ci

      # Integration tier (DB-backed; previously un-run in CI because it lives in the
      # tier the shared job skips). Seeds the canonical indexer schema (via
      # XCHAIN_INDEXER_SQL_PATH) into the source-db service. test:integration:ci runs
      # every integration suite EXCEPT five quarantined as red at HEAD (validated
      # 2026-06-22): client-bootstrap / client-live-sync / lifecycle fail on
      # the new fail-closed schema-apply halt (in-flight sync work), client-rollback
      # on a missing db.getStatusId helper, emissions-parity on its own hardcoded
      # 30s before-all timeout. Un-quarantine each in package.json as it goes green.
      - name: Run integration tier (green suites)
        # Independent of the e2e tier (own DBs, own schema seed); run even if the e2e
        # tier above failed, so a flake there can't mask the integration result.
        if: ${{ !cancelled() }}
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "23306"
          TEST_DB_USER: root
          TEST_DB_PASS: test
          XCHAIN_INDEXER_SQL_PATH: ${{ github.workspace }}/../xchain-indexer/src/sql
        run: npm run test:integration:ci

  # Cross-repo drift guards: this repo vendors the canonical
  # coin registry from xchain-hub, and per-repo CI cannot see sibling repos, so
  # a drifted vendored copy previously shipped green (the byte-identity checks
  # ran only in the monorepo's manual bin/ci-all.sh). This job recreates the
  # sibling layout (self + canonical side by side) and runs the same checks.
  # The canonical repo is private pre-launch, so its checkout uses a read-only
  # deploy key; drop the ssh-key line when the repos flip public at launch.
  drift-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: xchain-sync

      - name: Check out the canonical coin registry (xchain-hub)
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-hub
          ssh-key: ${{ secrets.XCHAIN_HUB_DEPLOY_KEY }}
          path: xchain-hub

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Coin-registry byte-identity vs canonical
        run: xchain-hub/bin/sync-coins.sh --check --only xchain-sync

      - name: Coin consensus-pin conformance (own vendored bundle)
        working-directory: xchain-sync
        run: |
          node -e '
            const coins = require("./src/coins");
            for (const net of ["testnet", "regtest"]) {
              const res = coins.verifyConsensusPin(net);
              if (res && res.skipped) throw new Error("consensus pin unexpectedly unarmed for " + net);
            }
            console.log("consensus pin conformance OK (testnet, regtest)");
          '

  # Coverage ratchet: re-run the unit suite under c8 and fail if line or
  # branch coverage drops below this repo's floor in bin/coverage-thresholds.json
  # (mirrored into the `coverage:check` npm script). Catches silent coverage
  # regression the pass/fail gate cannot see: a change that keeps every test green
  # while deleting the only test that reached a file. These are RATCHET FLOORS
  # (~1-1.5 points below measured), not tier targets; raise them as coverage climbs.
  coverage:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Coverage thresholds (c8 --check-coverage)
        run: npm run coverage:check
