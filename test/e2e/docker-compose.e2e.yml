version: '3.8'

# E2E test infrastructure for xchain-sync
# Usage: docker compose -f test/e2e/docker-compose.e2e.yml up -d --wait

services:

  source-db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: test
      MARIADB_USER: xchain-node
      MARIADB_PASSWORD: xchain-fixture-throwaway
    ports:
      - "23306:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - e2e-net

  replica-db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: test
      MARIADB_USER: xchain-node
      MARIADB_PASSWORD: xchain-fixture-throwaway
    ports:
      - "23307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - e2e-net

  source-db-2:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: test
      MARIADB_USER: xchain-node
      MARIADB_PASSWORD: xchain-fixture-throwaway
    ports:
      - "23308:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - e2e-net
    profiles:
      - cross-source

networks:
  e2e-net:
    driver: bridge
